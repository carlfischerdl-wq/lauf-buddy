name: Training verarbeiten & Website aktualisieren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: import-deploy
  cancel-in-progress: false

jobs:
  import-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Neue Trainings aus Health Auto Export einlesen
        run: node scripts/import-hae.mjs

      - name: Ergebnis speichern
        run: |
          git config user.name "lauf-buddy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "Training verarbeitet" && git push)

      - name: Website vorbereiten
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Website veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v4
